name: Auto Update News

on:
  schedule:
    # 毎日 JST 07:00 (UTC 22:00) に官公庁RSSをチェックしてニュース欄を自動更新
    - cron: '0 22 * * *'
  workflow_dispatch:
    # 手動実行可能

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch RSS feeds and update news data
        id: update
        run: |
          OUTPUT=$(python scripts/auto_update_news.py)
          echo "$OUTPUT"
          ADDED=$(echo "$OUTPUT" | grep -o 'ADDED=[0-9]*' | cut -d= -f2)
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.update.outputs.added != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Type-check before committing
        if: steps.update.outputs.added != '0'
        run: |
          npm ci
          npx tsc --noEmit

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/news.ts scripts/auto_news_state.json
          git diff --staged --quiet || git commit -m "chore: 官公庁RSSからニュースを自動追加 $(date +%Y-%m-%d)"
          git push
