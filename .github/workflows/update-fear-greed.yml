name: Update Fear & Greed Index Data

on:
  schedule:
    # JST 12:00 = UTC 03:00, JST 17:00 = UTC 08:00 (平日のみ)
    - cron: '0 3 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance numpy

      - name: Fetch data
        run: |
          cd scripts
          python fetch_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fear-greed/data.json
          git diff --cached --quiet || git commit -m "📊 Update Fear & Greed Index data $(date -u +%Y-%m-%dT%H:%M)"
          git push
